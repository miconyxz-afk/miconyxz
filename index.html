<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miconyxz</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f8f5ff 0,#f6f8ff 45%,#fff 100%);color:#1f2230}header{padding:14px 18px;background:rgba(255,255,255,.92);border-bottom:1px solid #e8e1f5;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:12px;backdrop-filter:blur(12px);box-shadow:0 5px 24px #5e3c8c0d}.logoMark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#8C52FF,#4BC0FF);color:white;font-size:23px;box-shadow:0 8px 20px #8c52ff35}.siteName{font-size:21px;letter-spacing:.2px}.tagline{font-size:11px;color:#7f7890;font-weight:500;margin-top:2px}.wrap{max-width:760px;margin:auto;padding:16px 16px 80px}.card{background:rgba(255,255,255,.95);border:1px solid #ebe6f5;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 10px 30px #6f56a812;transition:.2s}.card:active{transform:scale(.99)}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #ddd7ea;border-radius:14px;font:inherit;background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:#8C52FF;box-shadow:0 0 0 3px #8c52ff14}button{padding:11px 14px;border:0;border-radius:13px;font-weight:bold;background:#f0edf7;color:#40394d}.primary{background:linear-gradient(135deg,#8C52FF,#6f7dff);color:white;box-shadow:0 7px 18px #8c52ff30}.hidden{display:none}.muted{color:#777}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.controls button{flex:1}#text{white-space:pre-wrap;font-family:monospace;line-height:1.8;font-size:17px}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #e9e3f2;display:flex;justify-content:center;z-index:10;backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom)}nav button{background:transparent;color:#5c5567;font-size:12px;min-width:78px;padding:12px 8px}label{display:block;font-weight:bold;margin:12px 0 5px}
.hero{margin:10px 0 22px;padding:24px;border-radius:24px;background:linear-gradient(135deg,#221a36,#52348a 62%,#477ad9);color:#fff;box-shadow:0 16px 36px #3c2d6d2b;overflow:hidden;position:relative}.hero:after{content:"♪";position:absolute;right:18px;top:-15px;font-size:110px;opacity:.08}.hero h1{margin:6px 0 8px;font-size:29px}.hero p{margin:0;line-height:1.5;color:#eee8ff;font-size:14px;max-width:420px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#cbbaff;font-weight:800}h2{font-size:18px;margin-top:24px}#text{background:#faf9fd;padding:16px;border-radius:16px;border:1px solid #eee9f5}.muted{color:#81798d!important;font-size:13px}

.setHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.dark{color:#786d8a!important}.folderCard{display:flex;align-items:center;gap:14px;cursor:pointer}.folderIcon{font-size:31px}.folderInfo{flex:1}.folderInfo b{font-size:17px}.chev{font-size:28px;color:#aaa}.emptyState{text-align:center;color:#777;padding:28px 14px}.songInFolder{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee9f5;padding:13px 0}.songNum{width:30px;height:30px;border-radius:10px;background:#f0ebff;display:grid;place-items:center;font-weight:bold;color:#7651bd}.folderSongBody{flex:1;cursor:pointer}.songInFolder button{padding:7px 9px}.allSong{padding:22px 0;border-bottom:2px solid #eee9f5}.allSong:last-child{border-bottom:0}.allSong h2{margin:7px 0}.allSong pre{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.9;font-size:17px;background:#faf9fd;padding:16px;border-radius:16px;border:1px solid #eee9f5;overflow:auto}.songBadge{display:inline-block;background:#efe9ff;color:#7049b4;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:1px}
</style></head>
<body><header><div class="logoMark">M</div><div><div class="siteName">Miconyxz</div><div class="tagline">Worship chords, made simple.</div></div></header><div class="wrap">
<section id="home"><div class="hero"><div class="eyebrow">YOUR WORSHIP LIBRARY</div><h1>Play with confidence.</h1><p>Find songs, transpose chords, build setlists, and keep worship flowing.</p></div><input id="search" placeholder="🔎  Search songs or artists..." oninput="render()"><h2>Song Library</h2><div id="list"></div></section>
<section id="view" class="hidden"><button onclick="show('home')">← Back</button><div class="card"><h1 id="title"></h1><div id="artist" class="muted"></div><div class="controls"><button onclick="trans(-1)">− Transpose</button><button id="key"></button><button onclick="trans(1)">+ Transpose</button></div><div class="controls"><button onclick="font(-1)">A−</button><button onclick="autoScroll()">▶ Auto Scroll</button><button onclick="font(1)">A+</button></div><pre id="text"></pre><button class="primary" onclick="favorite()">♡ Favorite</button> <button onclick="toSet()">Add to Setlist</button></div></section>
<section id="add" class="hidden"><h2>Add Song</h2><div class="card"><label>Title</label><input id="at"><label>Artist</label><input id="aa"><label>Key</label><select id="ak"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select><label>Lyrics + Chords</label><textarea id="ax" rows="14" placeholder="G        C&#10;Lyrics here..."></textarea><br><br><button class="primary" onclick="addSong()">Save Song</button></div></section>
<section id="set" class="hidden">
<div class="setHead"><div><div class="eyebrow dark">WORSHIP SETLISTS</div><h2>Setlist Folders</h2></div><button class="primary" onclick="createSetlist()">＋ New Folder</button></div>
<div id="setList"></div></section>
<section id="setFolder" class="hidden">
<button onclick="show('set')">← All Setlists</button>
<div class="card"><div class="setHead"><div><div class="eyebrow dark">SETLIST FOLDER</div><h2 id="folderTitle"></h2></div><button onclick="renameFolder()">Rename</button></div>
<div class="controls"><button onclick="addSongToFolder()">＋ Add Song</button><button class="primary" onclick="viewAllChords()">🎸 View All Chords</button></div>
<div id="folderSongs"></div></div></section>
<section id="allChords" class="hidden">
<button onclick="openFolder(activeFolder)">← Back to Folder</button>
<div class="card"><div class="eyebrow dark">ALL CHORDS</div><h1 id="allTitle"></h1><div id="allChordContent"></div></div></section><section id="fav" class="hidden"><h2>Favorites</h2><div id="favList"></div></section></div>
<nav><button onclick="show('home')">🏠 Songs</button><button onclick="show('set')">🎶 Setlist</button><button onclick="show('fav')">♡ Favorites</button><button onclick="show('add')">＋ Add</button></nav>
<script>
const N=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];let data=JSON.parse(localStorage.getItem("songs")||"null")||[{title:"Amazing Grace",artist:"Traditional",key:"G",body:"G              C        G\nAmazing grace, how sweet the sound\nG                         D\nThat saved a wretch like me\nG              C        G\nI once was lost, but now am found\nG          D        G\nWas blind, but now I see"}],favs=JSON.parse(localStorage.getItem("favs")||"[]"),sets=JSON.parse(localStorage.getItem("setFolders")||"null")||[],cur=0,off=0,timer=null,activeFolder=-1;
if(!sets.length){let old=JSON.parse(localStorage.getItem("sets")||"[]");if(old.length)sets=[{name:"My Worship Setlist",songs:old}]}
function save(){localStorage.setItem("songs",JSON.stringify(data));localStorage.setItem("favs",JSON.stringify(favs));localStorage.setItem("setFolders",JSON.stringify(sets))}
function show(x){["home","view","add","set","fav","setFolder","allChords"].forEach(i=>document.getElementById(i).classList.add("hidden"));document.getElementById(x).classList.remove("hidden");if(x=="home")render();if(x=="set")renderSet();if(x=="fav")renderFav()}
function render(){let q=search.value.toLowerCase();list.innerHTML=data.map((s,i)=>({s,i})).filter(o=>(o.s.title+" "+o.s.artist).toLowerCase().includes(q)).map(o=>`<div class="card" onclick="openSong(${o.i})"><b>${o.s.title}</b><div class="muted">${o.s.artist} • Key ${o.s.key}</div></div>`).join("")}
function openSong(i){cur=i;off=0;show("view");draw()}function shift(n,s){let flats={Db:"C#",Eb:"D#",Gb:"F#",Ab:"G#",Bb:"A#"};n=flats[n]||n;let i=N.indexOf(n);return i<0?n:N[(i+s+120)%12]}
function tx(t,s){if(!s)return t;return t.replace(/\b([A-G](?:#|b)?)(m|maj|min|sus|dim|aug|add)?(\d*)?(\/([A-G](?:#|b)?))?\b/g,(m,r,q,n,sl,b)=>shift(r,s)+(q||"")+(n||"")+(b?"/"+shift(b,s):""))}
function draw(){let s=data[cur];title.textContent=s.title;artist.textContent=s.artist;key.textContent="Key: "+shift(s.key,off);text.textContent=tx(s.body,off)}
function trans(n){off+=n;draw()}function font(n){text.style.fontSize=(parseInt(getComputedStyle(text).fontSize)+n)+"px"}function autoScroll(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>scrollBy(0,1),45)}
function favorite(){let t=data[cur].title;if(favs.includes(t))favs=favs.filter(x=>x!=t);else favs.push(t);save();alert("Favorites updated")}function toSet(){
 if(!sets.length){sets.push({name:"My Worship Setlist",songs:[]})}
 let choices=sets.map((f,i)=>(i+1)+". "+f.name).join("\n");
 let n=parseInt(prompt("Add to which setlist folder?\n\n"+choices));
 if(!n||!sets[n-1])return;
 let title=data[cur].title;
 if(!sets[n-1].songs.includes(title))sets[n-1].songs.push(title);
 save();alert("Added to "+sets[n-1].name);
}
function createSetlist(){
 let name=prompt("Setlist folder name:");
 if(!name||!name.trim())return;
 sets.push({name:name.trim(),songs:[]});save();renderSet();
}
function renderSet(){
 setList.innerHTML=sets.length?sets.map((f,i)=>`<div class="card folderCard" onclick="openFolder(${i})"><div class="folderIcon">📁</div><div class="folderInfo"><b>${f.name}</b><div class="muted">${f.songs.length} song${f.songs.length==1?"":"s"} • Tap to open chords</div></div><div class="chev">›</div></div>`).join(""):"<div class='card emptyState'>No setlist folders yet.<br><br><button class='primary' onclick='createSetlist()'>＋ Create Setlist Folder</button></div>";
}
function openFolder(i){
 activeFolder=i;show("setFolder");folderTitle.textContent=sets[i].name;renderFolder();
}
function renderFolder(){
 let f=sets[activeFolder];
 folderSongs.innerHTML=f.songs.length?f.songs.map((title,i)=>{
   let si=data.findIndex(x=>x.title===title), song=si>=0?data[si]:null;
   return `<div class="songInFolder"><div class="songNum">${i+1}</div><div class="folderSongBody" onclick="openSong(${si})"><b>${title}</b><div class="muted">${song?"Key "+song.key:"Song unavailable"}</div></div><button onclick="event.stopPropagation();moveSong(${i},-1)">↑</button><button onclick="event.stopPropagation();moveSong(${i},1)">↓</button><button onclick="event.stopPropagation();removeFromFolder(${i})">×</button></div>`;
 }).join(""):"<div class='emptyState'>This folder is empty.<br><br>Tap <b>＋ Add Song</b>.</div>";
}
function addSongToFolder(){
 if(!data.length)return alert("Add songs to your library first.");
 let available=data.map((x,i)=>(i+1)+". "+x.title+" — Key "+x.key).join("\n");
 let n=parseInt(prompt("Choose a song number:\n\n"+available));
 if(!n||!data[n-1])return;
 let t=data[n-1].title;
 if(!sets[activeFolder].songs.includes(t))sets[activeFolder].songs.push(t);
 save();renderFolder();
}
function removeFromFolder(i){sets[activeFolder].songs.splice(i,1);save();renderFolder()}
function moveSong(i,d){let a=sets[activeFolder].songs,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderFolder()}
function renameFolder(){let n=prompt("New folder name:",sets[activeFolder].name);if(n&&n.trim()){sets[activeFolder].name=n.trim();save();folderTitle.textContent=n.trim();}}
function viewAllChords(){
 let f=sets[activeFolder];allTitle.textContent=f.name;
 allChordContent.innerHTML=f.songs.length?f.songs.map((t,i)=>{
  let song=data.find(x=>x.title===t);
  if(!song)return "";
  return `<div class="allSong"><div class="songBadge">SONG ${i+1}</div><h2>${song.title}</h2><div class="muted">${song.artist} • Key ${song.key}</div><pre>${escapeHtml(song.body)}</pre></div>`;
 }).join(""):"<div class='emptyState'>No songs in this folder.</div>";
 show("allChords");
}
function escapeHtml(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renderFav(){favList.innerHTML=favs.length?favs.map(x=>`<div class="card"><b>${x}</b></div>`).join(""):"<div class='card'>No favorites yet.</div>"}render();
</script></body></html>
